name: E2E Tests

on:
  push:
    branches:
      - claude/**
  pull_request:
    branches:
      - claude/continue-previous-session-OleqU

# Cancela runs anteriores del mismo branch si llega uno nuevo
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      # Valores dummy — los tests mockean Supabase y OpenAI, no llaman APIs reales.
      # No se usan secretos del repo a proposito (ver app/tests/fixtures/).
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_tests
      SUPABASE_SERVICE_ROLE_KEY: dummy_service_key_for_tests
      OPENAI_API_KEY: dummy_openai_key_for_tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14
